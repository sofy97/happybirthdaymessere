<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buon Compleanno Michi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0812;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
.bday-wrap{min-height:680px;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.stars-layer{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s);opacity:.2}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
.scene{position:relative;z-index:1;width:420px;display:flex;flex-direction:column;align-items:center;padding:44px 20px 56px}
.top-orn{color:#c9a96e;font-size:20px;letter-spacing:16px;margin-bottom:26px;animation:fadeD 1s ease both .3s;opacity:0}
.greeting-lbl{font-family:'Playfair Display',serif;font-style:italic;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#c9a96e;margin-bottom:8px;animation:fadeD 1s ease both .5s;opacity:0}
.name-wrap{text-align:center;margin-bottom:4px;animation:fadeD 1.2s ease both .8s;opacity:0}
.name{font-family:'Playfair Display',serif;font-size:80px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 80px rgba(201,169,110,.35)}
.name-line{display:block;width:100%;height:1px;background:linear-gradient(90deg,transparent,#c9a96e,transparent);margin:14px auto 0}
.subtitle{font-style:italic;font-weight:300;font-size:17px;color:rgba(255,255,255,.5);letter-spacing:3px;margin-top:13px;animation:fadeD 1s ease both 1.1s;opacity:0}
.div-row{display:flex;align-items:center;gap:12px;margin:26px 0 22px;animation:fadeD 1s ease both 1.3s;opacity:0}
.div-line{flex:1;height:1px}
.div-line:first-child{background:linear-gradient(90deg,transparent,rgba(201,169,110,.5))}
.div-line:last-child{background:linear-gradient(90deg,rgba(201,169,110,.5),transparent)}
.div-diamond{width:6px;height:6px;background:#c9a96e;transform:rotate(45deg)}
@keyframes fadeD{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeU{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.cake-area{position:relative;width:230px;height:210px;cursor:pointer;animation:fadeU 1.2s ease both 1.5s;opacity:0}
.plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:200px;height:14px;background:#2a2010;border-radius:50%}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:7px}
.t1{bottom:12px;width:182px;height:68px;background:#1f1508}
.t2{bottom:76px;width:138px;height:56px;background:#1f1508}
.t3{bottom:128px;width:94px;height:44px;background:#1f1508}
.frost{position:absolute;top:0;left:0;right:0;height:11px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#c9a96e,#9e7d47)}
.gband{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.6),transparent)}
.drip{position:absolute;top:9px;width:9px;height:18px;background:#c9a96e;border-radius:0 0 50% 50%}
.candle-row{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:10}
.candle{position:relative;width:8px;height:34px;border-radius:3px 3px 2px 2px}
.ca{background:linear-gradient(180deg,#e8d5b0,#c4a870)}
.cb{background:linear-gradient(180deg,#d4b896,#a67c52)}
.cc{background:linear-gradient(180deg,#f0e0c0,#d4aa70)}
.flame{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:8px;height:14px;background:radial-gradient(ellipse at 50% 80%,#fff7e0 0%,#ffcc44 30%,#ff8800 60%,transparent 100%);border-radius:50% 50% 60% 60%;box-shadow:0 0 8px rgba(255,200,0,.8);animation:flicker var(--fd,.5s) ease-in-out infinite;opacity:.95}
.glow-ring{position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);width:20px;height:20px;background:radial-gradient(circle,rgba(255,180,0,.5) 0%,transparent 70%);border-radius:50%;animation:glowP var(--fd,.5s) ease-in-out infinite}
@keyframes flicker{from{transform:translateX(-50%) scaleX(1) scaleY(1)}to{transform:translateX(-50%) scaleX(.85) scaleY(1.1) skewX(4deg)}}
@keyframes glowP{from{opacity:.5;transform:translateX(-50%) scale(1)}to{opacity:1;transform:translateX(-50%) scale(1.4)}}
.hint{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:2px;color:rgba(201,169,110,.6);text-transform:uppercase;white-space:nowrap;animation:breathe 2s ease-in-out infinite;opacity:.5}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.smoke{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:6px;height:22px;background:linear-gradient(to top,rgba(255,255,255,.25),transparent);border-radius:50%;animation:smokeUp 1.8s ease-out forwards}
@keyframes smokeUp{0%{opacity:1;transform:translateX(-50%) translateY(0) scaleX(1)}100%{opacity:0;transform:translateX(-50%) translateY(-36px) scaleX(3)}}

/* Climber styles */
.climber-rope{position:absolute;left:50%;top:0;width:2px;height:0;background:linear-gradient(180deg,#a67c52,#8b6a3c);transform:translateX(-50%);z-index:5;opacity:0;animation:ropeDescend 2s ease-in-out forwards}
@keyframes ropeDescend{0%{height:0;opacity:1}100%{height:240px;opacity:1}}
.climber{position:absolute;left:50%;top:0;width:20px;height:24px;z-index:6;opacity:0;animation:climberDescend 2s ease-in-out forwards}
.climber-body{width:16px;height:14px;background:linear-gradient(135deg,#e8a030,#d48020);border-radius:3px;position:relative;left:2px;top:4px}
.climber-head{width:8px;height:8px;background:#f4a050;border-radius:50%;position:absolute;left:6px;top:0}
.climber-arm{position:absolute;width:12px;height:2px;background:#f4a050;top:6px}
.climber-arm-left{left:2px;transform:rotate(-30deg);transform-origin:2px center}
.climber-arm-right{right:2px;transform:rotate(30deg);transform-origin:calc(100% - 2px) center;animation:armSwing 0.6s ease-in-out infinite}
.climber-leg{position:absolute;width:2px;height:8px;background:#3d3d3d;bottom:0}
.climber-leg-left{left:4px}
.climber-leg-right{right:4px;animation:legSwing 0.6s ease-in-out infinite}
@keyframes climberDescend{0%{top:-30px;opacity:0;transform:translateX(-50%)}10%{opacity:1}100%{top:210px;opacity:1;transform:translateX(-50%)}}
@keyframes armSwing{0%,100%{transform:rotate(30deg);transform-origin:calc(100% - 2px) center}50%{transform:rotate(-30deg);transform-origin:calc(100% - 2px) center}}
@keyframes legSwing{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-20deg)}}

.msg-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50;opacity:0;transition:opacity .9s ease}
.msg-overlay.visible{opacity:1;pointer-events:all}
.msg-card{text-align:center;padding:0 20px}
.msg-birthday{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;letter-spacing:5px;text-transform:uppercase;color:#c9a96e;margin-bottom:14px}
.msg-name{font-family:'Playfair Display',serif;font-size:72px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 60px rgba(201,169,110,.5),0 0 120px rgba(201,169,110,.2)}
.msg-wish{font-style:italic;font-weight:300;font-size:16px;color:rgba(255,255,255,.55);letter-spacing:1px;line-height:1.9;margin-top:16px}
.msg-wish em{font-style:normal;color:#c9a96e}
.msg-line{display:block;width:120px;height:1px;background:linear-gradient(90deg,transparent,#c9a96e,transparent);margin:18px auto 0}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:burst var(--dur,1.2s) ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.2)}}
</style>
</head>
<body>
<div class="bday-wrap" id="wrap">
  <div class="stars-layer" id="starsLayer"></div>

  <div class="scene" id="mainScene">
    <div class="top-orn">— ✦ —</div>
    <div class="greeting-lbl">Tanti auguri</div>
    <div class="name-wrap">
      <span class="name">Michi</span>
      <span class="name-line"></span>
    </div>
    <div class="subtitle">con tutto il cuore</div>
    <div class="div-row">
      <div class="div-line"></div>
      <div class="div-diamond"></div>
      <div class="div-line"></div>
    </div>

    <div class="cake-area" id="cakeArea">
      <div class="candle-row">
        <div class="candle ca" id="cn0"><div class="glow-ring" style="--fd:.45s"></div><div class="flame" style="--fd:.45s"></div></div>
        <div class="candle cb" id="cn1"><div class="glow-ring" style="--fd:.55s"></div><div class="flame" style="--fd:.55s"></div></div>
        <div class="candle cc" id="cn2"><div class="glow-ring" style="--fd:.5s"></div><div class="flame" style="--fd:.5s"></div></div>
      </div>
      <div class="tier t3">
        <div class="frost"></div>
        <div class="gband" style="top:13px"></div>
        <div class="drip" style="left:12px"></div>
        <div class="drip" style="left:36px"></div>
        <div class="drip" style="left:60px"></div>
      </div>
      <div class="tier t2">
        <div class="frost"></div>
        <div class="gband" style="top:13px"></div>
        <div class="gband" style="top:34px;opacity:.35"></div>
        <div class="drip" style="left:8px"></div>
        <div class="drip" style="left:32px"></div>
        <div class="drip" style="left:58px"></div>
        <div class="drip" style="left:84px"></div>
        <div class="drip" style="left:110px"></div>
      </div>
      <div class="tier t1">
        <div class="frost"></div>
        <div class="gband" style="top:13px"></div>
        <div class="gband" style="top:40px;opacity:.28"></div>
        <div class="drip" style="left:6px"></div>
        <div class="drip" style="left:28px"></div>
        <div class="drip" style="left:52px"></div>
        <div class="drip" style="left:76px"></div>
        <div class="drip" style="left:102px"></div>
        <div class="drip" style="left:128px"></div>
        <div class="drip" style="left:156px"></div>
      </div>
      <div class="plate"></div>
      <div class="hint" id="hintTxt">soffia le candeline ✦</div>
    </div>
  </div>

  <div class="msg-overlay" id="msgOverlay">
    <div class="msg-card">
      <div class="msg-birthday">Buon compleanno</div>
      <div class="msg-name">Michi</div>
      <span class="msg-line"></span>
      <div class="msg-wish">
        Che ogni tuo desiderio<br>
        si avveri come <em>magia</em>,<br>
        e che questo anno sia il più <em>bello</em> di tutti.
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const starsLayer = document.getElementById('starsLayer');
  for(let i=0;i<90;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*4}s;width:${Math.random()>.7?3:2}px;height:${Math.random()>.7?3:2}px`;
    starsLayer.appendChild(s);
  }

  const cakeArea=document.getElementById('cakeArea');
  const hint=document.getElementById('hintTxt');
  const overlay=document.getElementById('msgOverlay');
  const wrap=document.getElementById('wrap');
  let done=false;

  cakeArea.addEventListener('click',()=>{
    if(done)return;
    done=true;
    hint.style.display='none';

    // Create climber with rope
    const rect=cakeArea.getBoundingClientRect();
    const wRect=wrap.getBoundingClientRect();
    const cx=rect.left-wRect.left+rect.width/2;
    
    const rope=document.createElement('div');
    rope.className='climber-rope';
    rope.style.left=cx+'px';
    rope.style.top=(rect.top-wRect.top)+'px';
    wrap.appendChild(rope);

    const climber=document.createElement('div');
    climber.className='climber';
    climber.style.left=cx+'px';
    climber.style.top=(rect.top-wRect.top)+'px';
    climber.innerHTML=`
      <div class="climber-head"></div>
      <div class="climber-body">
        <div class="climber-arm climber-arm-left"></div>
        <div class="climber-arm climber-arm-right"></div>
      </div>
      <div class="climber-leg climber-leg-left"></div>
      <div class="climber-leg climber-leg-right"></div>
    `;
    wrap.appendChild(climber);

    [0,1,2].forEach((i)=>{
      setTimeout(()=>{
        const c=document.getElementById('cn'+i);
        const f=c.querySelector('.flame');
        const g=c.querySelector('.glow-ring');
        if(f)f.remove();
        if(g)g.remove();
        const sm=document.createElement('div');
        sm.className='smoke';
        c.appendChild(sm);
        setTimeout(()=>sm.remove(),1800);
      },i*130);
    });

    const cy=rect.top-wRect.top+80;
    const cols=['#c9a96e','#e8d5b0','#f0e0c0','#fff7e0','#a67c52','#ffffff','#ffd700'];
    for(let i=0;i<55;i++){
      const p=document.createElement('div');
      p.className='particle';
      const ang=Math.random()*Math.PI*2;
      const dist=70+Math.random()*170;
      const sz=3+Math.random()*5;
      p.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};--tx:${Math.cos(ang)*dist}px;--ty:${Math.sin(ang)*dist}px;--dur:${.9+Math.random()*.9}s`;
      wrap.appendChild(p);
      setTimeout(()=>p.remove(),1800);
    }

    setTimeout(()=>{
      rope.remove();
      climber.remove();
      overlay.classList.add('visible');
    },2200);
  });
})();
</script>
</body>
</html>
