<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Torta con Scalatore Goloso 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top, #8ec5ff 0%, #6a8dff 40%, #5b4ba2 100%);
    font-family:'Comic Sans MS', cursive;
}

/* Floating stars */
.star{
    position:absolute;
    color:white;
    animation: twinkle 2s infinite alternate;
    opacity:0.7;
}

@keyframes twinkle{
    from{ opacity:0.2; transform:scale(0.8);}
    to{ opacity:1; transform:scale(1.2);}
}

.container{
    position:relative;
    width:500px;
    height:650px;
}

/* =========================
   CAKE
========================= */

.cake{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
}

/* Bottom layer */
.layer1{
    width:300px;
    height:120px;
    background:linear-gradient(145deg,#d48c4d,#b56c2c);
    border-radius:20px;
    position:relative;
    overflow:hidden;
    box-shadow:
        inset -5px -5px 10px rgba(0,0,0,0.2),
        0 15px 30px rgba(0,0,0,0.3);
}

/* Middle layer */
.layer2{
    width:230px;
    height:90px;
    background:linear-gradient(145deg,#e8b26f,#c98739);
    border-radius:18px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:85px;
    overflow:hidden;
    box-shadow:
        inset -5px -5px 10px rgba(0,0,0,0.2),
        0 10px 25px rgba(0,0,0,0.25);
}

/* Top layer */
.layer3{
    width:160px;
    height:70px;
    background:linear-gradient(145deg,#ffd08c,#e6a545);
    border-radius:15px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:155px;
    overflow:hidden;
    box-shadow:
        inset -5px -5px 10px rgba(0,0,0,0.2),
        0 10px 20px rgba(0,0,0,0.25);
}

/* Frosting */
.frosting{
    position:absolute;
    top:0;
    width:100%;
    height:22px;
    background:#ff8ecf;
    border-radius:15px 15px 0 0;
}

.drip{
    position:absolute;
    width:22px;
    height:35px;
    background:#ff8ecf;
    border-radius:0 0 20px 20px;
}

.d1{ left:20px; }
.d2{ left:70px; height:28px; }
.d3{ left:130px; height:40px; }
.d4{ left:190px; height:25px; }
.d5{ left:250px; height:35px; }

/* Candles */
.candle{
    position:absolute;
    width:10px;
    height:40px;
    background:white;
    top:-35px;
    border-radius:3px;
}

.candle::before{
    content:'';
    position:absolute;
    width:12px;
    height:20px;
    background:orange;
    border-radius:50% 50% 50% 50%;
    top:-15px;
    left:-1px;
    animation:flicker 0.2s infinite alternate;
}

@keyframes flicker{
    from{ transform:scaleY(1);}
    to{ transform:scaleY(0.8);}
}

.c1{ left:35px; }
.c2{ left:75px; }
.c3{ left:115px; }

/* =========================
   BIRTHDAY TEXT
========================= */

.title{
    position:absolute;
    top:30px;
    width:100%;
    text-align:center;
    font-size:42px;
    color:white;
    text-shadow:0 5px 10px rgba(0,0,0,0.3);
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* =========================
   CLIMBER
========================= */

.climber{
    position:absolute;
    left:50%;
    top:40px;
    transform:translateX(-50%);
    z-index:50;
    animation: descend 10s linear infinite;
}

/* Rope */
.rope{
    width:4px;
    height:180px;
    background:#ddd;
    margin:auto;
}

/* Character */
.character{
    position:relative;
    width:60px;
    height:100px;
    margin:auto;
    margin-top:-5px;
}

/* Head */
.head{
    width:24px;
    height:24px;
    background:#ffd8b0;
    border-radius:50%;
    position:absolute;
    left:18px;
    top:0;
}

/* Eyes */
.eye{
    width:3px;
    height:3px;
    background:#222;
    border-radius:50%;
    position:absolute;
    top:9px;
}

.eye.left{ left:7px; }
.eye.right{ right:7px; }

/* Mouth eating */
.mouth{
    position:absolute;
    width:10px;
    height:6px;
    border-radius:0 0 10px 10px;
    background:#d14;
    left:7px;
    top:15px;
    animation: chew 0.3s infinite alternate;
}

@keyframes chew{
    from{
        transform:scaleY(1);
    }
    to{
        transform:scaleY(0.3);
    }
}

/* Body */
.body{
    width:20px;
    height:35px;
    background:#4ecdc4;
    border-radius:8px;
    position:absolute;
    left:20px;
    top:22px;
}

/* Arms */
.arm{
    width:18px;
    height:5px;
    background:#ffd8b0;
    position:absolute;
    top:32px;
    border-radius:5px;
    transform-origin:left center;
}

.left-arm{
    left:5px;
    animation:leftArm 0.6s infinite alternate;
}

.right-arm{
    right:5px;
    animation:rightArm 0.6s infinite alternate;
}

@keyframes leftArm{
    from{
        transform:rotate(40deg);
    }
    to{
        transform:rotate(80deg);
    }
}

@keyframes rightArm{
    from{
        transform:rotate(-40deg);
    }
    to{
        transform:rotate(-80deg);
    }
}

/* Legs */
.leg{
    width:20px;
    height:5px;
    background:#333;
    position:absolute;
    top:58px;
    border-radius:5px;
}

.left-leg{
    left:10px;
    transform:rotate(35deg);
}

.right-leg{
    right:10px;
    transform:rotate(-35deg);
}

/* Descend animation */
@keyframes descend{
    0%{
        transform:translateX(-50%) translateY(-30px);
    }

    100%{
        transform:translateX(-50%) translateY(250px);
    }
}

/* =========================
   CAKE BITES
========================= */

.bite{
    position:absolute;
    width:30px;
    height:30px;
    background:#5b4ba2;
    border-radius:50%;
    opacity:0;
}

/* Bites appear while descending */
.b1{
    top:20px;
    right:10px;
    animation:bite1 10s infinite;
}

.b2{
    top:60px;
    left:5px;
    animation:bite2 10s infinite;
}

.b3{
    top:20px;
    right:0;
    animation:bite3 10s infinite;
}

@keyframes bite1{
    0%,20%{
        opacity:0;
    }
    25%,100%{
        opacity:1;
    }
}

@keyframes bite2{
    0%,45%{
        opacity:0;
    }
    50%,100%{
        opacity:1;
    }
}

@keyframes bite3{
    0%,70%{
        opacity:0;
    }
    75%,100%{
        opacity:1;
    }
}

/* =========================
   CRUMBS
========================= */

.crumb{
    position:absolute;
    width:8px;
    height:8px;
    background:#ffcf88;
    border-radius:50%;
    opacity:0;
    animation: crumbs 2s infinite;
}

.c-crumb1{
    top:230px;
    left:240px;
    animation-delay:0.2s;
}

.c-crumb2{
    top:260px;
    left:260px;
    animation-delay:0.6s;
}

.c-crumb3{
    top:320px;
    left:220px;
    animation-delay:1s;
}

@keyframes crumbs{
    0%{
        opacity:0;
        transform:translateY(0);
    }
    20%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translateY(30px);
    }
}

.subtitle{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
    font-size:24px;
    text-shadow:0 2px 5px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<div class="star" style="top:10%;left:20%;">✨</div>
<div class="star" style="top:15%;left:70%;">⭐</div>
<div class="star" style="top:25%;left:85%;">✨</div>
<div class="star" style="top:35%;left:10%;">⭐</div>

<div class="container">

    <div class="title">
        Happy Birthday Michi 🎂
    </div>

    <!-- Climber -->
    <div class="climber">

        <div class="rope"></div>

        <div class="character">

            <div class="head">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
            </div>

            <div class="body"></div>

            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>

            <div class="leg left-leg"></div>
            <div class="leg right-leg"></div>

        </div>
    </div>

    <!-- Cake -->
    <div class="cake">

        <div class="layer1">
            <div class="frosting"></div>

            <div class="drip d1"></div>
            <div class="drip d2"></div>
            <div class="drip d3"></div>
            <div class="drip d4"></div>
            <div class="drip d5"></div>

            <!-- bites -->
            <div class="bite b1"></div>
            <div class="bite b2"></div>
        </div>

        <div class="layer2">
            <div class="frosting"></div>

            <div class="bite b3"></div>
        </div>

        <div class="layer3">
            <div class="frosting"></div>

            <div class="candle c1"></div>
            <div class="candle c2"></div>
            <div class="candle c3"></div>
        </div>

    </div>

    <!-- Crumbs -->
    <div class="crumb c-crumb1"></div>
    <div class="crumb c-crumb2"></div>
    <div class="crumb c-crumb3"></div>

    <div class="subtitle">
        Lo scalatore sta divorando la torta 😭🍰
    </div>

</div>

</body>
</html>
